spring:
  config:
    activate:
      on-profile: test

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test?MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=true;DATABASE_TO_UPPER=false;
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379
      password: bamdoliro

  cloud:
    aws:
      s3:
        bucket: maru-s3-test-bucket
        endpoint: http://localhost:4566
      stack:
        auto: false
      region:
        static: us-east-1
      credentials:
        instance-profile: true
        access-key: test
        secret-key: test

  logging:
    level:
      com.amazonaws.util.EC2MetadataUtils: error

  servlet:
    multipart:
      max-file-size: 10MB

  jasypt:
    encryptor:
      key: bamdoliro-test-encryptor-password
      salt: bamdoliro-test-encryptor-salt

jwt:
  refresh-expiration-time: 1296000000 # 15일
  access-expiration-time: 3600000 # 1시간
  prefix: Bearer
  secret-key: bamdoliro-test-secret-jjangjjangsecretimjuldaeyoochulgeumji

neis:
  key: bamdoliro-test-neis-key

message:
  api-key: bamdoliro-test-message-key
  api-secret: bamdoliro-test-message-secret
  api-domain: https://bamdoliro-test-message-domain
  from: 00000000000

domain:
  name: this.is.maru.domain.com

debug: false
