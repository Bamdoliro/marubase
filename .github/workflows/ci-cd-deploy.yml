name: Deploy to AWS EC2

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env: 
  S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEIS_KEY: ${{ secrets.NEIS_KEY }}
      MESSAGE_API_KEY: ${{ secrets.MESSAGE_API_KEY }}
      MESSAGE_API_SECRET: ${{ secrets.MESSAGE_API_SECRET }}
      MESSAGE_API_DOMAIN: ${{ secrets.MESSAGE_API_DOMAIN }}
      MESSAGE_FROM: ${{ secrets.MESSAGE_FROM }}
      ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
      ENCRYPTION_SALT: ${{ secrets.ENCRYPTION_SALT }}
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test -x asciidoctor

    - name: Make Directory
      run: mkdir -p deploy

    - name: Copy Jar
      run: cp ./build/libs/*.jar ./deploy

    - name: Make zip file
      run: zip -r ./maru.zip ./deploy 
      shell: bash

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with: 
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    - name: Upload to S3
      run: aws s3 cp --region ap-northeast-2 ./maru.zip s3://$S3_BUCKET_NAME/
  
