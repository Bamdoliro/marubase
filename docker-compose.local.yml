version: '3'

services:
  mysql:
    container_name: maru.local.db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "bamdoliro"
      POSTGRES_PASSWORD: "bamdoliro"
      POSTGRES_DB: "maru"
    ports:
      - "5432:5432"

  redis:
    image: redis:7.0-alpine
    container_name: maru.local.redis
    command: /bin/sh -c "redis-server --requirepass bamdoliro"
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: maru.local.localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - TZ=Asia/Seoul
    volumes:
      - ./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh